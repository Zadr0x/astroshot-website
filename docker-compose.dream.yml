services:
  dream:
    image: node:24-bookworm-slim
    working_dir: /app
    command: ["./node_modules/.bin/next", "start", "-p", "3021", "-H", "0.0.0.0"]
    restart: unless-stopped
    env_file:
      - /root/.openclaw/secrets/dream-api.env
    environment:
      NODE_ENV: production
    volumes:
      - .:/app
    labels:
      - traefik.enable=true
      - traefik.http.routers.astroshot-tech-dream.rule=Host(`astroshot.tech`)
      - traefik.http.routers.astroshot-tech-dream.entrypoints=websecure
      - traefik.http.routers.astroshot-tech-dream.tls.certresolver=letsencrypt
      - traefik.http.services.astroshot-tech-dream.loadbalancer.server.port=3021
